# ==============================================================================
# configs/docker-compose.yml - LiteLLM 统一网关与 PostgreSQL 审计持久化栈
# 启动命令: docker compose -f configs/docker-compose.yml up -d
# ==============================================================================

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: litellm-proxy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    command:
      - "--port"
      - "4000"
      - "--config"
      - "/app/config.yaml"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1d307c0eb1dc6106851fe89bd3aff3534757d4aa0d9fcc954b89461fe8e507a5}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: litellm-postgres
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  litellm_postgres_data:
