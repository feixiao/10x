# Aider 个人版开箱即用配置文件 (.aider.conf.yml)
# 将此文件放置在项目根目录，或通过 `aider --config configs/solo/.aider.conf.yml` 指定

# 默认走本地 LiteLLM 代理网关
openai-api-base: http://localhost:4000/v1
openai-api-key: dummy

# 双模型分工（架构师模式）
model: openai/architect-model
editor-model: openai/coder-model
architect: true

# Git 与版本控制
auto-commits: true
dirty-commits: false
attribute-author: true
attribute-committer: true

# 缓存与性能
cache-prompts: true
map-tokens: 2048

# 默认代码红线约束
dark-mode: true
show-diffs: true
