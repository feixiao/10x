# LiteLLM Proxy - 个人超级个体版 (Solo Edition)
# 职责：20% 云端重推理 (架构/排查) + 80% 本地算力 (LMStudio 本地大模型编写代码/单测自愈/文档)
# 启动命令: litellm --config configs/solo/litellm.yaml --port 4000

model_list:
  # 1. 架构师模型 (用于 --architect 顶层思考与拆解，走本地 Magpie 网关旗舰云端模型)
  - model_name: architect-model
    litellm_params:
      model: openai/antigravity/claude-sonnet-5-5
      api_base: http://127.0.0.1:3425/v1
      api_key: dummy
      temperature: 0.2
      max_tokens: 8192

  # 备用架构师模型 (Magpie 深度推理 / 复杂重构模型: GPT-6 Luna)
  - model_name: architect-model-backup
    litellm_params:
      model: openai/codex/gpt-6-luna
      api_base: http://127.0.0.1:3425/v1
      api_key: dummy
      temperature: 0.2
      max_tokens: 8192

  # 快速推理架构师模型 (Magpie 高效轻量重推理模型: Gemini 3.8 Flash)
  - model_name: architect-model-fast
    litellm_params:
      model: openai/antigravity/gemini-3.8-flash
      api_base: http://127.0.0.1:3425/v1
      api_key: dummy
      temperature: 0.2
      max_tokens: 8192
  - model_name: coder-model
    litellm_params:
      model: openai/qwen3.8-27b-splash
      api_base: http://localhost:1234/v1
      api_key: dummy
      temperature: 0.1
      max_tokens: 8192

  # 备用轻量编码模型 (LMStudio 已加载的模型)
  - model_name: coder-model-fast
    litellm_params:
      model: openai/google/gemma-4-26b-a4b-qat
      api_base: http://localhost:1234/v1
      api_key: dummy
      temperature: 0.1

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  timeout: 60

litellm_settings:
  drop_params: true
  set_verbose: false
