# LiteLLM Proxy - 企业级安全网关配置 (Enterprise Edition)
# 职责：多租户鉴权、虚拟 API Key、费用配额、数据审计、PII/敏感数据过滤与高可用故障转移
# 启动命令: docker compose -f configs/enterprise/docker-compose.enterprise.yml up -d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # 平台管理员密钥
  database_url: os.environ/DATABASE_URL       # PostgreSQL 审计日志与计费数据库
  store_model_in_db: true

model_list:
  # 企业云端主力推理模型 (带并发限制与故障转移)
  - model_name: claude-3-7-sonnet
    litellm_params:
      model: anthropic/claude-3-7-sonnet-20250219
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 100
      tpm: 100000

  - model_name: deepseek-r1
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 120

  # 企业私有 GPU 集群 / vLLM 算力池 (本地代码模型)
  - model_name: enterprise-coder-pool
    litellm_params:
      model: openai/qwen2.5-coder-32b-instruct
      api_base: os.environ/VLLM_INTERNAL_ENDPOINT
      api_key: os.environ/VLLM_INTERNAL_KEY

router_settings:
  routing_strategy: usage-based-routing
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  # 数据防泄露与审计开关
  success_callback: ["postgres"]
  failure_callback: ["postgres"]
  # 预警通知（支持 slack / webhook / email）
  alerting: ["slack"]
  alerting_threshold: 300 # 超额自动告警
