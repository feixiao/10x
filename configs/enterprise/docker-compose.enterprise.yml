version: '3.8'

services:
  # 1. LiteLLM 统一模型网关
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: enterprise-litellm-proxy
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://litellm_user:litellm_secure_pass@litellm-db:5432/litellm_audit
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-enterprise-master-secret-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    depends_on:
      litellm-db:
        condition: service_healthy
    restart: unless-stopped

  # 2. 审计与计费数据库 (PostgreSQL)
  litellm-db:
    image: postgres:16-alpine
    container_name: enterprise-litellm-db
    environment:
      - POSTGRES_USER=litellm_user
      - POSTGRES_PASSWORD=litellm_secure_pass
      - POSTGRES_DB=litellm_audit
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm_user -d litellm_audit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  litellm_db_data:
